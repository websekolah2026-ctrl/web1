<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Paskibraka - MA Al Anbawi</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f7f4;
            color: #174b36;
        }

        header {
            background: #087c51;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 25px;
            text-align: center;
        }

        .foto-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .foto-grid img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
        }

        .kembali {
            display: inline-block;
            margin: 25px;
            padding: 12px 22px;
            background: #087c51;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Galeri Paskibra</h1>
    <p>Madrasah Aliyah Al Anbawi</p>
</header>

<div class="container">
